name: Version

# Tags every merge to main as a release, v<major>.<minor>.<build>, and creates its GitHub release.
# The release line comes from the root package.json, whose patch slot counts builds: the first
# merge on a line uses package.json's value exactly (bumping to 1.2.0 mints v1.2.0), and later
# merges on the line count up from the newest tag. scripts/next-version.mjs makes the computation,
# the same one the changelog check makes on the pull request, so the tag is the version the merge's
# CHANGELOG.md section names.
#
# A tag rather than a version commit back to main: it works on a protected branch and never
# re-triggers CI. The Deploy workflow runs when this one succeeds, so what deploys is a tagged
# release. To see which release a checkout is: git describe --tags
on:
  push:
    branches: [main]

permissions:
  contents: write # to push the tag and create the release

# Two merges close together must not compute the same tag.
concurrency:
  group: version-main
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every tag, to count the builds on the line
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # This job needs only Node. Without this, setup-node sees packageManager in
          # package.json and looks for pnpm to set up a cache.
          package-manager-cache: false
      - name: Tag the merge and create its release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A rerun finds the tag it made and makes no second one.
          tag=$(git tag --points-at "$GITHUB_SHA" --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$tag" ]; then
            tag="v$(node scripts/next-version.mjs)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag"
            git push origin "refs/tags/$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" \
              --notes "Release $tag. What changed is in CHANGELOG.md."
          fi
          echo "### Released \`$tag\` from \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
