name: Deploy

# Manual only. Needs these in the repository's settings before the first run:
#   secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   variables: VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY
# For a live deploy, also these secrets, so the build can read the private tuning file:
#   PRIVATE_REPOSITORY (owner/name), PRIVATE_REPOSITORY_DEPLOY_KEY (a read-only deploy key)
# Without them the Worker is built on the public default tuning and refuses live scans.
# Worker secrets (SUPABASE_SECRET_KEY, RESEND_API_KEY) are set once with `wrangler secret put`.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PRIVATE_REPOSITORY: ${{ secrets.PRIVATE_REPOSITORY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check out the private companion
        if: env.PRIVATE_REPOSITORY != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPOSITORY }}
          ssh-key: ${{ secrets.PRIVATE_REPOSITORY_DEPLOY_KEY }}
          path: private
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      # With the private companion checked out, this also checks its tuning file against the schema.
      - run: pnpm test
      - name: Build the web app and deploy the Worker
        run: pnpm cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
