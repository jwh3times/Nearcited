name: Deploy

# Every merge to main: runs when the Version workflow has tagged it, and deploys that commit. It
# can also be run by hand, which deploys the branch it is run on. The hosted project's pending
# migrations are applied first, then both Workers deploy: a migration leaves the running Worker
# working (AGENTS.md), and a failed one stops the deploy before anything new goes live.
# Credentials come from the 1Password `Nearcited` vault at run time, through a service account
# that can read only that vault. Before the first run:
#   secret:    OP_SERVICE_ACCOUNT_TOKEN (the only credential GitHub holds)
#   variables: VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY (public values)
#   vault:     the items named by the op:// references in the "Load credentials" steps
# The smoke test after the deploy runs once the deployment has a test account (see the README's
# "Deploy" section): set the repository variable SMOKE_TEST to "on" when it does.
# Worker secrets (SUPABASE_SECRET_KEY, RESEND_API_KEY) are set once with `wrangler secret put`.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Version]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # After a merge, only once its tag is made.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A workflow_run event carries main's newest commit; deploy the one that was tagged.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Load credentials from 1Password
        id: op
        uses: 1password/load-secrets-action@v5
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          PRIVATE_REPOSITORY: op://Nearcited/Nearcited Workspace/private_repository
          # A read-only deploy key on the private companion. The query asks for the format git reads.
          PRIVATE_REPOSITORY_DEPLOY_KEY: op://Nearcited/Nearcited Deploy Key/private key?ssh-format=openssh
          CLOUDFLARE_API_TOKEN: op://Nearcited/Cloudflare/api_token
          CLOUDFLARE_ACCOUNT_ID: op://Nearcited/Cloudflare/account_id
          # The Supabase CLI reads the hosted project with the token and writes with the password.
          SUPABASE_ACCESS_TOKEN: op://Nearcited/Supabase/access_token
          SUPABASE_DB_PASSWORD: op://Nearcited/Supabase/db_password
          SUPABASE_PROJECT_REF: op://Nearcited/Supabase/project_ref
      # The build reads private/tuning.json. Without it the Worker gets the public default tuning
      # and refuses live scans (docs/adr/0001-private-tuning-as-data.md).
      - name: Check out the private companion
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.op.outputs.PRIVATE_REPOSITORY }}
          ssh-key: ${{ steps.op.outputs.PRIVATE_REPOSITORY_DEPLOY_KEY }}
          path: private
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Also checks the private tuning file against the schema.
      - run: pnpm test
      # The same version CI asks for, the newest; #278 is to pin it.
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      # Prints the migrations the hosted project has not applied, and writes nothing. `db push`
      # refuses a migration dated before the newest one applied (that would need --include-all).
      - name: List the migrations to apply
        run: supabase db push --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ steps.op.outputs.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ steps.op.outputs.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ steps.op.outputs.SUPABASE_PROJECT_REF }}
      - name: Apply the migrations
        run: supabase db push --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ steps.op.outputs.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ steps.op.outputs.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ steps.op.outputs.SUPABASE_PROJECT_REF }}
      # Both Workers: the main one with the app, then the Pages Worker that serves hosted pages
      # (docs/adr/0019-hosted-pages-are-served-by-a-worker-of-their-own.md).
      - name: Build the web app and deploy the Workers
        run: pnpm cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.op.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.op.outputs.CLOUDFLARE_ACCOUNT_ID }}
          # Shown in the operator's view, so what is live can be told at a glance.
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

  # Signs in to what was just deployed as its test account and uses it the way a person would:
  # add a location, scan it, read the results, remove it. A test organization's scans are
  # generated, so this asks no assistant and costs nothing
  # (docs/adr/0003-platform-roles-and-test-accounts.md).
  smoke:
    name: Smoke test the deployment
    needs: deploy
    if: vars.SMOKE_TEST == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Load the test account from 1Password
        id: op
        uses: 1password/load-secrets-action@v5
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TEST_ACCOUNT_EMAIL: op://Nearcited/Smoke test/username
          TEST_ACCOUNT_PASSWORD: op://Nearcited/Smoke test/password
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the browser
        run: pnpm --filter @nearcited/e2e exec playwright install --with-deps chromium
      # The address is read from the Worker's own config, so this tests what was deployed.
      - name: Find the deployment
        run: >-
          node --input-type=module -e
          "import { readDeployment } from './scripts/create-audit.mjs';
          console.log('E2E_APP_URL=' + readDeployment(process.cwd()).appUrl)"
          >> "$GITHUB_ENV"
      - run: pnpm smoke
        env:
          E2E_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          TEST_ACCOUNT_EMAIL: ${{ steps.op.outputs.TEST_ACCOUNT_EMAIL }}
          TEST_ACCOUNT_PASSWORD: ${{ steps.op.outputs.TEST_ACCOUNT_PASSWORD }}
      - name: Keep the report when the smoke test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
