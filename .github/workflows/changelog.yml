name: Changelog Version

# Guards the changelog under `Scheme: stamp-on-tag`
# (docs/adr/0034-a-merges-changelog-section-is-written-when-it-is-tagged.md).
#
# No branch names a version or edits CHANGELOG.md's sections: each writes its entries to its own
# changelog.d/<branch-slug>.md fragment, and version.yml stamps them into the merge's dated section
# after it lands. scripts/check-changelog.mjs fails a pull request that adds, removes or renumbers a
# version section (except a backfill for a version already tagged with none), adds entries to
# `## [Unreleased]`, edits or deletes a fragment already on main (it belongs to the merge that
# added it), or adds a fragment that does not parse. A pull request with no fragment passes: its
# merge gets a one-entry section from its title, so Dependabot's run the same check with no
# exemption.
#
# The job keeps its name from the scheme before (it no longer predicts a version): the main ruleset
# requires "Changelog names the version this merge mints" by name, and a renamed job would leave
# that check pending.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog-version:
    name: Changelog names the version this merge mints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, to diff the branch against its merge base
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check the changelog and fragments
        run: node scripts/check-changelog.mjs
